  - { name: 'HK-01', type: ss, server: edge.example.com, port: 10002, cipher: aes-128-gcm, password: 'p1', udp: true, plugin: obfs, plugin-opts: { mode: http, host: fake.baidu.com } }
  - { name: 'JP-01', type: ss, server: edge.example.com, port: 10009, cipher: aes-128-gcm, password: 'p1', udp: true, plugin: obfs, plugin-opts: { mode: http, host: fake.baidu.com } }
  - { name: 'US-01', type: ss, server: edge.example.com, port: 10008, cipher: aes-128-gcm, password: 'p1', udp: true, plugin: obfs, plugin-opts: { mode: http, host: fake.baidu.com } }
